[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safepckids"
version = "0.0.1"
description = "Controle Parental Inteligente com Reconhecimento Facial para Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SafePCKids Team" }
]
dependencies = [
    "opencv-python>=4.10,<5",
    "numpy>=1.26,<3",
]

[project.scripts]
safepckids = "safepckids.launcher:main"
safepckids-admin = "safepckids.launcher:admin_main"
safepckids-installer = "safepckids.launcher:installer_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["safepckids*"]

[tool.setuptools.package-data]
safepckids = [
    "ui_assets/*",
    "ui_assets/**/*",
]
