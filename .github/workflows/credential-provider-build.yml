name: Credential Provider compile check
on:
  push:
    paths:
      - 'native/credential_provider_poc/**'
      - '.github/workflows/credential-provider-build.yml'
  pull_request:
    paths:
      - 'native/credential_provider_poc/**'
      - '.github/workflows/credential-provider-build.yml'
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Credential Provider skeleton (build-only)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /LD native\credential_provider_poc\provider.cpp /link /OUT:FaceKidsEmptyProvider.dll Ole32.lib
          if errorlevel 1 exit /b 1
          dumpbin /exports FaceKidsEmptyProvider.dll
          if errorlevel 1 exit /b 1
