name: Credential Provider compile and host checks
on:
  push:
    paths:
      - 'native/credential_provider_poc/**'
      - '.github/workflows/credential-provider-build.yml'
  pull_request:
    paths:
      - 'native/credential_provider_poc/**'
      - '.github/workflows/credential-provider-build.yml'
jobs:
  compile-and-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build provider and isolated COM host
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /LD native\credential_provider_poc\provider.cpp /link /OUT:FaceKidsDiagnosticProvider.dll /EXPORT:DllGetClassObject=FaceKidsGetClassObject /EXPORT:DllCanUnloadNow=FaceKidsCanUnloadNow Ole32.lib Advapi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /DFACEKIDS_DIAGNOSTIC_HOST_TEST /LD native\credential_provider_poc\provider.cpp /link /OUT:FaceKidsDiagnosticHostTest.dll /EXPORT:DllGetClassObject=FaceKidsGetClassObject /EXPORT:DllCanUnloadNow=FaceKidsCanUnloadNow Ole32.lib Advapi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 native\credential_provider_poc\host.cpp /link /OUT:FaceKidsProviderHost.exe Ole32.lib
          if errorlevel 1 exit /b 1
          FaceKidsProviderHost.exe FaceKidsDiagnosticHostTest.dll
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 native\credential_provider_poc\test_production_deny.cpp /link /OUT:FaceKidsProductionDenyTest.exe Ole32.lib
          if errorlevel 1 exit /b 1
          FaceKidsProductionDenyTest.exe FaceKidsDiagnosticProvider.dll
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 native\windows_broker_poc\broker.cpp /link /OUT:FaceKidsBrokerPoc.exe Advapi32.lib Wtsapi32.lib winsqlite3.lib ole32.lib mfplat.lib mf.lib mfuuid.lib shell32.lib mfreadwrite.lib
          if errorlevel 1 exit /b 1
      - name: Verify stalled broker cannot hang Credential Provider
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 native\credential_provider_poc\test_stalled_pipe.cpp /link /OUT:FaceKidsStalledPipeTest.exe
          if errorlevel 1 exit /b 1
          FaceKidsStalledPipeTest.exe
          if errorlevel 1 exit /b 1
      - name: Isolated Credential Provider IPC client receives negative precheck
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $broker = Join-Path $PWD 'FaceKidsBrokerPoc.exe'
          $providerHost = Join-Path $PWD 'FaceKidsProviderHost.exe'
          $server = Start-Process -FilePath $broker -ArgumentList '--console-once' -PassThru -NoNewWindow
          try {
            Start-Sleep -Milliseconds 600
            & $providerHost 'FaceKidsDiagnosticHostTest.dll' '--precheck'
            if ($LASTEXITCODE -ne 0) { throw "Provider COM/IPC test failed ($LASTEXITCODE)" }
            if (-not $server.WaitForExit(12000)) { throw 'One-shot broker IPC timeout' }
            if ($server.ExitCode -ne 0) { throw "Broker exited with $($server.ExitCode)" }
            Write-Host 'PASS: CP transport spoke to broker, admin was denied, zero credentials'
          } finally {
            if (-not $server.HasExited) { $server.Kill(); $server.WaitForExit() }
          }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FaceKidsCredentialProvider-DiagnosticHostOnly
          path: |
            FaceKidsDiagnosticProvider.dll
            FaceKidsDiagnosticHostTest.dll
            FaceKidsProviderHost.exe
          retention-days: 14
