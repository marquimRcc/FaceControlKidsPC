name: Credential Provider compile and host checks
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/credential-provider-build.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/credential-provider-build.yml'
jobs:
  compile-and-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build provider and isolated COM host
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /LD native\credential_provider_poc\provider.cpp /link /OUT:SafePCKidsDiagnosticProvider.dll /EXPORT:DllGetClassObject=SafePCKidsGetClassObject /EXPORT:DllCanUnloadNow=SafePCKidsCanUnloadNow Ole32.lib Advapi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /DSAFEPCKIDS_DIAGNOSTIC_HOST_TEST /LD native\credential_provider_poc\provider.cpp /link /OUT:SafePCKidsDiagnosticHostTest.dll /EXPORT:DllGetClassObject=SafePCKidsGetClassObject /EXPORT:DllCanUnloadNow=SafePCKidsCanUnloadNow Ole32.lib Advapi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 native\credential_provider_poc\host.cpp /link /OUT:SafePCKidsProviderHost.exe Ole32.lib
          if errorlevel 1 exit /b 1
          SafePCKidsProviderHost.exe SafePCKidsDiagnosticHostTest.dll
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 native\credential_provider_poc\test_production_deny.cpp /link /OUT:SafePCKidsProductionDenyTest.exe Ole32.lib
          if errorlevel 1 exit /b 1
          SafePCKidsProductionDenyTest.exe SafePCKidsDiagnosticProvider.dll
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 native\windows_broker_poc\broker.cpp /link /OUT:SafePCKidsBrokerPoc.exe Advapi32.lib Wtsapi32.lib winsqlite3.lib ole32.lib mfplat.lib mf.lib mfuuid.lib shell32.lib mfreadwrite.lib
          if errorlevel 1 exit /b 1
      - name: Verify stalled broker cannot hang Credential Provider
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 native\credential_provider_poc\test_stalled_pipe.cpp /link /OUT:SafePCKidsStalledPipeTest.exe
          if errorlevel 1 exit /b 1
          SafePCKidsStalledPipeTest.exe
          if errorlevel 1 exit /b 1
      - name: Isolated Credential Provider IPC client receives negative precheck
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $broker = Join-Path $PWD 'SafePCKidsBrokerPoc.exe'
          $providerHost = Join-Path $PWD 'SafePCKidsProviderHost.exe'
          $server = Start-Process -FilePath $broker -ArgumentList '--console-once' -PassThru -NoNewWindow
          try {
            Start-Sleep -Milliseconds 600
            & $providerHost 'SafePCKidsDiagnosticHostTest.dll' '--precheck'
            if ($LASTEXITCODE -ne 0) { throw "Provider COM/IPC test failed ($LASTEXITCODE)" }
            if (-not $server.WaitForExit(12000)) { throw 'One-shot broker IPC timeout' }
            if ($server.ExitCode -ne 0) { throw "Broker exited with $($server.ExitCode)" }
            Write-Host 'PASS: CP transport spoke to broker, admin was denied, zero credentials'
          } finally {
            if (-not $server.HasExited) { $server.Kill(); $server.WaitForExit() }
          }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SafePCKidsCredentialProvider-DiagnosticHostOnly
          path: |
            SafePCKidsDiagnosticProvider.dll
            SafePCKidsDiagnosticHostTest.dll
            SafePCKidsProviderHost.exe
          retention-days: 14

  build-real-credential-provider:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build real SafePCKids Credential Provider and test hosts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -ExecutionPolicy Bypass -File native/credential_provider_safepckids/build.ps1
      - name: Run TestProviderHost.exe to verify COM instantiation
        shell: pwsh
        working-directory: native/credential_provider_safepckids
        run: |
          $ErrorActionPreference = 'Stop'
          # LogonUI does not inherit the CI compiler PATH. Load the provider
          # using only Windows system directories to detect missing runtimes.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          .\TestProviderHost.exe
          if ($LASTEXITCODE -ne 0) { throw "TestProviderHost failed with exit code $LASTEXITCODE" }
      - name: Run TestPipeClient.exe to verify non-blocking pipe timeout
        shell: pwsh
        working-directory: native/credential_provider_safepckids
        run: |
          $ErrorActionPreference = 'Stop'
          .\TestPipeClient.exe
          if ($LASTEXITCODE -ne 0) { throw "TestPipeClient failed with exit code $LASTEXITCODE" }
      - name: Verify JSON envelope strict parser and synthetic pipe SID
        shell: pwsh
        working-directory: native/credential_provider_safepckids
        run: |
          .\TestJsonEnvelopeGuardPortable.exe
          if ($LASTEXITCODE -ne 0) { throw 'JSON guard failed' }
          .\TestPipePeerIdentity.exe
          if ($LASTEXITCODE -ne 0) { throw 'Pipe server identity failed' }
      - name: Verify automatic retry and late-response cancellation in isolated host
        shell: pwsh
        working-directory: native/credential_provider_safepckids
        run: |
          .\TestCredentialRetry.exe
          if ($LASTEXITCODE -ne 0) { throw "TestCredentialRetry failed ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SafePCKidsCredentialProvider-Real
          path: |
            native/credential_provider_safepckids/SafePCKidsCredentialProvider.dll
            native/credential_provider_safepckids/TestProviderHost.exe
            native/credential_provider_safepckids/TestPipeClient.exe
            native/credential_provider_safepckids/TestCredentialRetry.exe
          retention-days: 14
