name: Credential Provider compile check
on:
  push:
    paths:
      - 'native/credential_provider_poc/**'
      - '.github/workflows/credential-provider-build.yml'
  pull_request:
    paths:
      - 'native/credential_provider_poc/**'
      - '.github/workflows/credential-provider-build.yml'
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Credential Provider skeleton
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /LD native\credential_provider_poc\provider.cpp /link /OUT:FaceKidsEmptyProvider.dll Ole32.lib
