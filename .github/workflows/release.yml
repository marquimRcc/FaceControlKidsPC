name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão para publicação (ex: v0.0.1)'
        required: false
        default: 'v0.0.1'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Single-EXE Installer
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Create .venv and install requirements
        shell: pwsh
        run: |
          Write-Host "Criando ambiente virtual .venv..."
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          Write-Host "Instalando dependencias de requirements.txt no .venv..."
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements.txt

      - name: Download facial recognition models
        shell: pwsh
        run: |
          Write-Host "Baixando modelos faciais ONNX (YuNet e SFace)..."
          .\.venv\Scripts\python.exe -m safepckids.cli --models models download-models

      - name: Run unit test suite
        shell: pwsh
        run: |
          Write-Host "Executando testes unitarios com .venv\Scripts\python.exe..."
          $testOutput = & .\.venv\Scripts\python.exe -m unittest discover -s tests 2>&1 | Out-String
          Write-Host $testOutput
          if ($LASTEXITCODE -ne 0) {
              throw "Falha na execucao dos testes unitarios (codigo $LASTEXITCODE)."
          }
          Write-Host "Suite integral concluida; regressao de seguranca tambem sera executada explicitamente."

      - name: Run security regression suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($suite in @(
            'test_app_server_install.py',
            'test_parity_endpoints.py',
            'test_auth_service.py',
            'test_windows_login_guardrails.py'
          )) {
            & .\.venv\Scripts\python.exe -m unittest discover -s tests -p $suite -v
            if ($LASTEXITCODE -ne 0) { throw "Security regression suite failed: $suite" }
          }

      - name: Prepare code signing certificate (if secrets available)
        id: prepare-cert
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          if (-not $env:SIGNING_CERT_BASE64) {
            throw 'Windows signing certificate secret is required for releases.'
          }
          $certBytes = [Convert]::FromBase64String($env:SIGNING_CERT_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP 'safepckids_signing_cert.pfx'
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          Add-Content -Path $env:GITHUB_ENV -Value "SAFEPCKIDS_SIGNING_CERT=$certPath"

      - name: Build SafePCKids-Instalador-Windows-x64.exe
        shell: pwsh
        env:
          SAFEPCKIDS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          Write-Host "Iniciando compilacao do instalador..."
          & scripts/Construir-SafePCKids-Setup.ps1

      - name: Confirm EXE self-test
        shell: pwsh
        run: |
          $exePath = "dist\SafePCKids-Instalador-Windows-x64.exe"
          if (-not (Test-Path -LiteralPath $exePath)) {
              throw "Executavel nao encontrado em $exePath"
          }
          Write-Host "Executando autoteste do executavel ($exePath --self-test)..."
          $proc = Start-Process -FilePath $exePath -ArgumentList "--self-test" -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
              throw "O autoteste do EXE falhou com codigo de saida $($proc.ExitCode)."
          }
          Write-Host "Autoteste do EXE concluido com sucesso (codigo 0)."

      - name: Validate code signature
        shell: pwsh
        run: |
          $exePath = "dist\SafePCKids-Instalador-Windows-x64.exe"
          $dllPath = "native\credential_provider_safepckids\SafePCKidsCredentialProvider.dll"
          $sigExe = Get-AuthenticodeSignature -FilePath $exePath
          $sigDll = Get-AuthenticodeSignature -FilePath $dllPath

          if (-not $env:SAFEPCKIDS_SIGNING_CERT -or -not (Test-Path -LiteralPath $env:SAFEPCKIDS_SIGNING_CERT)) {
              throw 'Signing certificate unavailable; unsigned releases are forbidden.'
          }
          if ($sigExe.Status -ne 'Valid') {
              throw "Assinatura do EXE invalida: $($sigExe.Status) ($($sigExe.StatusMessage))"
          }
          if ($sigDll.Status -ne 'Valid') {
              throw "Assinatura da DLL invalida: $($sigDll.Status) ($($sigDll.StatusMessage))"
          }
          Write-Host "EXE e DLL validados com sucesso via Authenticode."
          Set-Content -Path "dist\SIGNING_STATUS.txt" -Value "SIGNED"

      - name: Clean up signing certificate
        if: always()
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "safepckids_signing_cert.pfx"
          if (Test-Path -LiteralPath $certPath) {
              Remove-Item -LiteralPath $certPath -Force
          }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $exePath = "dist\SafePCKids-Instalador-Windows-x64.exe"
          $hash = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash.ToLower()
          $fileName = [System.IO.Path]::GetFileName($exePath)
          $checksumLine = "$hash  $fileName"
          [System.IO.File]::WriteAllLines((Join-Path (Get-Location) "dist\SHA256SUMS.txt"), @($checksumLine), [System.Text.Encoding]::ASCII)
          Write-Host "SHA256SUMS.txt gerado com sucesso:"
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload Windows Installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/SafePCKids-Instalador-Windows-x64.exe
            dist/SHA256SUMS.txt
            dist/SIGNING_STATUS.txt
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release_assets

      - name: Verify checksum
        run: |
          cd release_assets
          sed -i 's/\r$//' SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Prepare Release Notes and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          FINAL_TAG="${INPUT_TAG:-$TAG_NAME}"
          if [ -z "$FINAL_TAG" ] || [ "$FINAL_TAG" = "main" ]; then
            FINAL_TAG="v0.0.1"
          fi
          VERSION="${FINAL_TAG#v}"

          SIGNING_STATUS=$(tr -d '\r\n' < release_assets/SIGNING_STATUS.txt 2>/dev/null || echo "UNSIGNED")

          if [ "$SIGNING_STATUS" != "SIGNED" ]; then
            echo "Release recusada: artefato sem assinatura verificada." >&2
            exit 1
          fi
          SIGNING_NOTE="### 🔒 Assinatura Digital\n- O executável e a DLL do Credential Provider foram assinados digitalmente via Authenticode e validados."

          SHA256_LINE=$(cat release_assets/SHA256SUMS.txt)
          EXE_SIZE=$(stat -c%s "release_assets/SafePCKids-Instalador-Windows-x64.exe" 2>/dev/null || echo "0")
          EXE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $EXE_SIZE / 1048576}")

          cat <<EOF > release_notes.md
          ## SafePCKids $VERSION

          Primeira release oficial do **SafePCKids** para Windows x64.

          ### 📦 Arquivos da Release
          - **SafePCKids-Instalador-Windows-x64.exe** (~${EXE_SIZE_MB} MB)
          - **SHA256SUMS.txt** (Checksum de integridade SHA-256)

          ### 🛡️ Integridade e Hashes
          \`\`\`
          $SHA256_LINE
          \`\`\`

          $SIGNING_NOTE

          ### ⚙️ Características e Requisitos
          - **Instalação com 2 cliques**: Executável único autônomo com um único prompt de UAC.
          - **Conta Supervisionada 'Filhos'**: Provisionamento da conta existente ou criação com senha aleatória, protegida via DPAPI.
          - **Sessão Segura**: O agente na sessão Filhos opera sem privilégios administrativos e sem prompts de UAC.
          - **Validação de Testes**: 544 testes unitários automatizados (531 aprovados e 13 ignorados em ambiente Windows limpo).
          EOF

          echo "Notas da Release preparadas:"
          cat release_notes.md

          echo "Publicando release no GitHub..."
          if gh release view "$FINAL_TAG" >/dev/null 2>&1; then
            echo "Release $FINAL_TAG já existente; atualizando arquivos..."
            gh release upload "$FINAL_TAG" \
              release_assets/SafePCKids-Instalador-Windows-x64.exe \
              release_assets/SHA256SUMS.txt \
              --clobber
            gh release edit "$FINAL_TAG" \
              --title "SafePCKids $VERSION" \
              --notes-file release_notes.md \
              --draft=false \
              --prerelease=false
          else
            echo "Criando nova release pública para $FINAL_TAG..."
            gh release create "$FINAL_TAG" \
              release_assets/SafePCKids-Instalador-Windows-x64.exe \
              release_assets/SHA256SUMS.txt \
              --title "SafePCKids $VERSION" \
              --notes-file release_notes.md
          fi
