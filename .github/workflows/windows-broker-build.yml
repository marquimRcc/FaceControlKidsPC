name: Windows broker SCM and protected IPC PoC
on:
  push:
    paths:
      - 'native/windows_broker_poc/**'
      - '.github/workflows/windows-broker-build.yml'
  pull_request:
    paths:
      - 'native/windows_broker_poc/**'
      - '.github/workflows/windows-broker-build.yml'
jobs:
  native-broker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Windows native broker without installing service
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 native\windows_broker_poc\broker.cpp /link /OUT:FaceKidsBrokerPoc.exe Advapi32.lib Wtsapi32.lib winsqlite3.lib ole32.lib mfplat.lib mf.lib mfuuid.lib shell32.lib
          if errorlevel 1 exit /b 1
          FaceKidsBrokerPoc.exe --self-test
          if errorlevel 1 exit /b 1
          FaceKidsBrokerPoc.exe --service-identity
          if errorlevel 1 exit /b 1
          FaceKidsBrokerPoc.exe --camera-capability
          if errorlevel 1 exit /b 1
          FaceKidsBrokerPoc.exe --sessions
          if errorlevel 1 exit /b 1
      - name: Reject non-SYSTEM broker identity in interactive admin runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = & .\FaceKidsBrokerPoc.exe --service-identity
          if ($LASTEXITCODE -ne 0 -or $result -ne 'NOT_SYSTEM') {
            throw "Elevated runner token was unexpectedly treated as SYSTEM: $result"
          }
          Write-Host 'PASS: interactive administrator is NOT LocalSystem'
      - name: Verify SYSTEM/admin pipe and one-shot reply (no service registration)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'FaceKidsBrokerPoc.exe'
          $server = Start-Process -FilePath $exe -ArgumentList '--console-once' -PassThru -NoNewWindow
          try {
            Start-Sleep -Milliseconds 600
            & $exe --ping
            if ($LASTEXITCODE -ne 0) { throw "Authenticated pipe client failed: $LASTEXITCODE" }
            if (-not $server.WaitForExit(12000)) { throw 'One-shot pipe did not exit' }
            if ($server.ExitCode -ne 0) { throw "One-shot server failed: $($server.ExitCode)" }
          } finally {
            if (-not $server.HasExited) { $server.Kill(); $server.WaitForExit() }
          }
      - name: Check non-biometric camera capability over local broker pipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'FaceKidsBrokerPoc.exe'
          $server = Start-Process -FilePath $exe -ArgumentList '--console-once' -PassThru -NoNewWindow
          try {
            Start-Sleep -Milliseconds 600
            & $exe --camera-status
            if ($LASTEXITCODE -ne 0) { throw "Camera query failed: $LASTEXITCODE" }
            if (-not $server.WaitForExit(12000)) { throw 'Broker pipe timeout' }
            if ($server.ExitCode -ne 0) { throw "Broker server failed" }
          } finally {
            if (-not $server.HasExited) { $server.Kill(); $server.WaitForExit() }
          }
      - name: Reject precheck from administrator (never issue credential)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'FaceKidsBrokerPoc.exe'
          $server = Start-Process -FilePath $exe -ArgumentList '--console-once' -PassThru -NoNewWindow
          try {
            Start-Sleep -Milliseconds 600
            & $exe --precheck-as-admin
            if ($LASTEXITCODE -ne 0) { throw "Admin precheck was not denied cleanly: $LASTEXITCODE" }
            if (-not $server.WaitForExit(12000)) { throw 'One-shot pipe did not exit' }
            if ($server.ExitCode -ne 0) { throw "One-shot server failed: $($server.ExitCode)" }
          } finally {
            if (-not $server.HasExited) { $server.Kill(); $server.WaitForExit() }
          }
      - name: Deny malformed request over live Windows named pipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'FaceKidsBrokerPoc.exe'
          $server = Start-Process -FilePath $exe -ArgumentList '--console-once' -PassThru -NoNewWindow
          try {
            Start-Sleep -Milliseconds 600
            & $exe --malformed-request
            if ($LASTEXITCODE -ne 0) { throw "Malformed IPC request was not denied" }
            if (-not $server.WaitForExit(12000)) { throw 'Broker did not terminate' }
            if ($server.ExitCode -ne 0) { throw "Broker failed: $($server.ExitCode)" }
          } finally {
            if (-not $server.HasExited) { $server.Kill(); $server.WaitForExit() }
          }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FaceKidsBrokerPoc-HostOnly
          path: FaceKidsBrokerPoc.exe
          retention-days: 14
