name: Unit tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Windows P6 VM harness PowerShell syntax check only
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Testar-P5-P6-VM-FaceKids.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'P6 harness PowerShell syntax failed'
          }
      - name: Hosted Windows - real Tk three-theme switch with synthetic profiles
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m scripts.ci_parent_theme_tk_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Real Tk parent theme smoke failed' }
      - name: Windows-only pilot launcher parse and three-child status smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Iniciar-Piloto-Filhos.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell pilot launcher parse failed"
          }
          $data = Join-Path $env:RUNNER_TEMP 'facekids-children-ci.sqlite3'
          try {
            $lines = @(python -m facekids.children_pilot --database $data status)
            if ($LASTEXITCODE -ne 0) { throw 'Children CLI status failed' }
            $recognized = @($lines | Where-Object {
              $_.StartsWith('Crianca ') -and
              $_.Contains('0 amostras; 120 minutos restantes hoje.')
            })
            if ($recognized.Count -ne 3) {
              throw "Unexpected pilot profiles: $($lines -join '; ')"
            }
          } finally {
            Remove-Item -LiteralPath $data -Force -ErrorAction SilentlyContinue
          }
