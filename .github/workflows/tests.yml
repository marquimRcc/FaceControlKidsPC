name: Unit tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Windows VM one-liner/bootstrap syntax and no-install assertions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path 'scripts/Iniciar-FaceKids-VM-Developer.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $source, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'VM launcher PowerShell syntax failed'
          }
          $content = Get-Content -LiteralPath $source -Raw
          # Assemble forbidden command names without embedding literal
          # registration tokens in a CI workflow source file.
          $blocked = @(('reg' + 'svr32'), ('Register' + '-ScheduledTask'),
                       ('New' + '-Service'), ('Set' + '-Acl'))
          foreach ($command in $blocked) {
            if ($content.Contains($command)) {
              throw ('VM launcher contains forbidden operation: ' + $command)
            }
          }
      - name: Windows VM native Python module smoke (no quote stripping)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m facekids.vm_guest_diagnostics dependencies
          if ($LASTEXITCODE -ne 0) {
            throw 'VM native dependency probe failed'
          }
      - name: Windows VM staged CP install PowerShell parse and guardrails
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = (Resolve-Path 'scripts/FaceKids-VM-Autenticacao.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'VM auth staging installer PowerShell syntax failed'
          }
          $source = Get-Content -LiteralPath $file -Raw
          $blocked = @(('Register' + '-ScheduledTask'), ('New' + '-Service'))
          foreach ($command in $blocked) {
            if ($source.Contains($command)) {
              throw ('Unexpected VM logon staging mutation: ' + $command)
            }
          }
      - name: Windows VM one-command auth driver parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = (Resolve-Path 'scripts/Preparar-FaceKids-Autenticacao-VM.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'VM authentication one-command driver PowerShell syntax failed'
          }
      - name: Windows PowerShell 5.1 restricted-policy nested script smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'facekids-nested-exec-policy.ps1'
          Set-Content -LiteralPath $fixture -Encoding ASCII -Value 'Write-Output FACEKIDS_NESTED_SCRIPT_OK'
          # Simulate the VM's Restricted host and run the nested file via
          # a child with process-scoped Bypass, with no persistent policy changes.
          $cmd = '& powershell.exe -NoProfile -ExecutionPolicy Bypass -File "' + $fixture + '"'
          $output = & powershell.exe -NoProfile -ExecutionPolicy Restricted -Command $cmd
          if ($LASTEXITCODE -ne 0 -or $output -notcontains 'FACEKIDS_NESTED_SCRIPT_OK') {
            throw ('Nested script was blocked by execution policy: ' + ($output -join '; '))
          }
      - name: Windows P6 VM harness PowerShell syntax check only
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Testar-P5-P6-VM-FaceKids.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'P6 harness PowerShell syntax failed'
          }
      - name: Hosted Windows - real Tk three-theme switch with synthetic profiles
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m scripts.ci_parent_theme_tk_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Real Tk parent theme smoke failed' }
      - name: Windows-only pilot launcher parse and dynamic-profile status smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Iniciar-Piloto-Filhos.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell pilot launcher parse failed"
          }
          $data = Join-Path $env:RUNNER_TEMP 'facekids-children-ci.sqlite3'
          try {
            python -m facekids.children_pilot --database $data add-profile 'Perfil CI 1' --minutes 120
            if ($LASTEXITCODE -ne 0) { throw 'Single child profile creation failed' }
            $single = @(python -m facekids.children_pilot --database $data status)
            if ($LASTEXITCODE -ne 0) { throw 'Single child status failed' }
            $singleProfiles = @($single | Where-Object {
              $_.StartsWith('Perfil CI ') -and
              $_.Contains('0 amostras; 120 minutos restantes hoje.')
            })
            if ($singleProfiles.Count -ne 1) {
              throw "Unexpected single profile status: $($single -join '; ')"
            }
            2..5 | ForEach-Object {
              python -m facekids.children_pilot --database $data add-profile "Perfil CI $_" --minutes 120
              if ($LASTEXITCODE -ne 0) { throw "Child profile $_ creation failed" }
            }
            $multiple = @(python -m facekids.children_pilot --database $data status)
            if ($LASTEXITCODE -ne 0) { throw 'Multiple child status failed' }
            $multipleProfiles = @($multiple | Where-Object {
              $_.StartsWith('Perfil CI ') -and
              $_.Contains('0 amostras; 120 minutos restantes hoje.')
            })
            if ($multipleProfiles.Count -ne 5) {
              throw "Unexpected multiple profile status: $($multiple -join '; ')"
            }
          } finally {
            @($data, "$data-wal", "$data-shm") | ForEach-Object {
              Remove-Item -LiteralPath $_ -Force -ErrorAction SilentlyContinue
            }
          }
