name: Unit tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Portable JSON envelope guard (C++17, isolated)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic native/credential_provider_facekids/TestJsonEnvelopeGuardPortable.cpp -o "$RUNNER_TEMP/facekids-json-guard"
          "$RUNNER_TEMP/facekids-json-guard"
      - name: Read-only ACL audit syntax and uninstalled-host smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Auditar-Permissoes-FaceKids.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw "ACL audit PowerShell parse failed: $($errors[0].Message)" }
          $missing = Join-Path $env:RUNNER_TEMP 'facekids-not-installed'
          $result = & ./scripts/Auditar-Permissoes-FaceKids.ps1 -Root $missing | ConvertFrom-Json
          if (@($result).Count -ne 11) { throw "ACL audit did not report eleven expected locations" }
          if (@($result | Where-Object { $_.Exists }).Count -ne 0) {
            throw "ACL audit found unexpected installed data on disposable runner"
          }
      - name: Installer read-only preflight on disposable runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:ProgramData 'FaceKids'
          $dll = Join-Path $root 'FaceKidsCredentialProvider.dll'
          $beforeDll = Test-Path -LiteralPath $dll
          $beforeTask = [bool](Get-ScheduledTask -TaskName 'FaceKidsFilhosAgent' -ErrorAction SilentlyContinue)
          $report = & ./scripts/Instalar-FaceKids-Nativo.ps1 -PreflightOnly | ConvertFrom-Json
          if (@($report).Count -ne 11) { throw 'Installer preflight did not enumerate protected paths' }
          $afterDll = Test-Path -LiteralPath $dll
          $afterTask = [bool](Get-ScheduledTask -TaskName 'FaceKidsFilhosAgent' -ErrorAction SilentlyContinue)
          if ($beforeDll -ne $afterDll -or $beforeTask -ne $afterTask) {
            throw 'Preflight changed Credential Provider or scheduled task state'
          }
      - name: Recovery audit is read-only on disposable runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = & ./scripts/Desinstalar-FaceKids-Nativo.ps1 -AuditOnly | ConvertFrom-Json
          if ($null -eq $report -or $report.HardwareRollbackVerified -ne $false) {
            throw 'Recovery audit cannot claim hardware rollback validation'
          }
          if ($report.ProviderDllPresent -or $report.ProviderRegistered -or $report.ChildTaskPresent) {
            throw 'Recovery audit unexpectedly found an installed provider on CI runner'
          }
      - name: Read-only pipe provenance diagnostic
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = (Resolve-Path 'scripts/Auditar-Identidade-PipeFaceKids.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw "Pipe provenance script parse failure: $($errors[0].Message)" }
          $report = & $script | ConvertFrom-Json
          if ($report.NamedPipeServerIdentityVerified -ne $false -or
              $report.SafeForAuthentication -ne $false) {
            throw 'Read-only diagnostic must not claim authentication trust'
          }
      - name: Windows-only pilot launcher parse and three-child status smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Iniciar-Piloto-Filhos.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell pilot launcher parse failed"
          }
          $data = Join-Path $env:RUNNER_TEMP 'facekids-children-ci.sqlite3'
          try {
            $lines = @(python -m facekids.children_pilot --database $data status)
            if ($LASTEXITCODE -ne 0) { throw 'Children CLI status failed' }
            $recognized = @($lines | Where-Object {
              $_.StartsWith('Crianca ') -and
              $_.Contains('0 amostras; 120 minutos restantes hoje.')
            })
            if ($recognized.Count -ne 3) {
              throw "Unexpected pilot profiles: $($lines -join '; ')"
            }
          } finally {
            Remove-Item -LiteralPath $data -Force -ErrorAction SilentlyContinue
          }
