name: Linux Regata OS checks

on:
  push:
  pull_request:

jobs:
  linux-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise Linux integration tests
        run: >-
          python -m unittest -v
          tests.test_linux_admin
          tests.test_linux_auth
          tests.test_linux_installer
          tests.test_linux_probe
          tests.test_linux_runtime
      - name: Validate Regata OS shell entry points
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            scripts/*RegataOS.sh \
            packaging/facekids-admin \
            packaging/facekids-linux-probe \
            packaging/facekids-pam-helper
          do
            bash -n "$script"
          done
