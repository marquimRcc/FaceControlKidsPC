name: Linux Regata OS checks

on:
  push:
  pull_request:

jobs:
  linux-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise Linux integration tests
        run: >-
          python -m unittest -v
          tests.test_linux_admin
          tests.test_linux_auth
          tests.test_linux_installer
          tests.test_linux_probe
          tests.test_linux_runtime
      - name: Validate Regata OS shell entry points
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            scripts/*RegataOS.sh \
            scripts/Empacotar-SafePCKids-Desktop-Linux.sh \
            packaging/safepckids-admin \
            packaging/safepckids-admin-gui \
            packaging/safepckids-child-gui \
            packaging/install-safepckids-desktop-bundle \
            packaging/safepckids-linux-probe \
            packaging/safepckids-pam-helper
          do
            bash -n "$script"
          done
      - name: Validate systemd service directives
        shell: bash
        run: |
          set -euo pipefail
          unit=$(mktemp --suffix=.service)
          cp packaging/safepckids-linux.service "$unit"
          sed -i \
            -e 's#^ExecStart=.*#ExecStart=/usr/bin/true#' \
            -e 's#^WorkingDirectory=.*#WorkingDirectory=/tmp#' \
            "$unit"
          systemd-analyze verify "$unit"
