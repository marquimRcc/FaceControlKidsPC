name: Security Analysis

on:
  push:
  pull_request:
  schedule:
    - cron: '37 4 * * 1'

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hash-verified application dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install pinned security scanners
        run: python -m pip install bandit==1.8.6 pip-audit==2.9.0
      - name: Scan Python source with Bandit
        run: bandit -q -r safepckids -ll
      - name: Audit locked dependencies
        run: pip-audit -r requirements.txt
